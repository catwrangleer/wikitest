<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Gallery | Wiki Cat</title>
    <link rel="stylesheet" href="./style.css" type="text/css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Cat Gallery</h1>
            <p>Browse the cutest cat moments</p>
            <nav class="page-nav" aria-label="Main navigation">
                <a class="nav-button" href="./index.html">Home</a>
                <a class="nav-button" href="./videos.html">Cat Videos</a>
                <a class="nav-button" href="./games.html">Cat Games</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <h2>Featured Cats</h2>
            <div class="gallery-grid">
                <figure class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1511044568932-338cba0ad803?auto=format&fit=crop&w=900&q=80" alt="Orange cat lounging">
                    <figcaption>Orange cat lounging in the sun.</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?auto=format&fit=crop&w=900&q=80" alt="White cat looking curious">
                    <figcaption>Curious white cat watching the world.</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1574158622682-e40e69881006?auto=format&fit=crop&w=900&q=80" alt="Gray cat with yellow eyes">
                    <figcaption>Gray cat with bright eyes and a calm stare.</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1519052537078-e6302a4968d4?auto=format&fit=crop&w=900&q=80" alt="Black cat sitting on the floor">
                    <figcaption>Black cat sitting perfectly still.</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1526336024174-e58f5cdd8e13?auto=format&fit=crop&w=900&q=80" alt="Tabby cat stretched out">
                    <figcaption>Tabby cat stretching after a nap.</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1495360010541-f48722b34f7d?auto=format&fit=crop&w=900&q=80" alt="Kitten yawning">
                    <figcaption>A sleepy kitten after a long day of play.</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <a href="./index.html">Back to Home</a>
        </div>
    </footer>
</body>
</html>
