<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Gallery | Wiki Cat</title>
    <link rel="stylesheet" href="./style.css" type="text/css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Cat Gallery</h1>
            <p>Browse real cat personalities, moods, and favorite lounging spots</p>
            <nav class="page-nav" aria-label="Main navigation">
                <a class="nav-button" href="./index.html">Home</a>
                <a class="nav-button" href="./videos.html">Cat Videos</a>
                <a class="nav-button" href="./games.html">Cat Games</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <h2>Featured Cats</h2>
            <div class="gallery-grid">
                <figure class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1511044568932-338cba0ad803?auto=format&fit=crop&w=900&q=80" alt="Orange tabby cat lounging in sunlight">
                    <figcaption>Orange tabby cat stretched out in a warm patch of sunlight, relaxed and completely at ease.</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?auto=format&fit=crop&w=900&q=80" alt="White cat watching from a chair">
                    <figcaption>White cat perched alert and curious, watching the room with bright eyes and a tilted head.</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1574158622682-e40e69881006?auto=format&fit=crop&w=900&q=80" alt="Gray cat staring calmly">
                    <figcaption>Gray cat with a calm expression, slow blink, and a quiet, confident posture.</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1519052537078-e6302a4968d4?auto=format&fit=crop&w=900&q=80" alt="Black cat sitting on the floor">
                    <figcaption>Black cat sitting low and still, a classic observer with a soft, watchful stare.</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1526336024174-e58f5cdd8e13?auto=format&fit=crop&w=900&q=80" alt="Tabby cat stretching after a nap">
                    <figcaption>Tabby cat waking up from a nap, stretching out with a long, sleepy yawn and a loose tail.</figcaption>
                </figure>
                <figure class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1495360010541-f48722b34f7d?auto=format&fit=crop&w=900&q=80" alt="Kitten with a sleepy expression">
                    <figcaption>Young kitten looking sleepy but alert, with a gentle expression and a little bit of baby fluff.</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <a href="./index.html">Back to Home</a>
        </div>
    </footer>
</body>
</html>
